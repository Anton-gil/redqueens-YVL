[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./corpus/data" }, { access = "read-write", path = "./orchestrator/state" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
